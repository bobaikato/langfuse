version: 1
project:
  name: langfuse
  description: Langfuse readiness slice covering documented source development, CI-style verification, published self-host compose runtime, and source docker-build runtime; release/publish and cloud deployment workflows remain out of scope
  type: application
metadata:
  ota:
    minimum_version: "1.6.20"
execution:
  default_context: host
  contexts:
    host:
      backend: native
      only_on:
        - linux
        - macos
toolchains:
  node:
    provider: corepack
    version: "24"
    package_managers:
      pnpm: "11.1.3"
tools:
  docker:
    version: "*"
    required: false
  migrate:
    version: "*"
    required: false
  clickhouse:
    version: "*"
    required: false
env:
  sources:
    - kind: dotenv
      path: .env
    - kind: dotenv
      path: .env.test
surfaces:
  web:
    kind: http
    port: 3000
    path: /
    readiness:
      kind: http
      method: GET
      path: /api/public/health
      success:
        status:
          - 200
      body:
        contains: '"status":"OK"'
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 20s
  worker:
    kind: http
    port: 3030
    path: /api/health
    readiness:
      kind: http
      method: GET
      path: /api/health
      success:
        status:
          - 200
      body:
        contains: '"status":"ok"'
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 20s
services:
  postgres:
    manager:
      kind: compose
      name: langfuse-dev
      file: docker-compose.dev.yml
      service: postgres
    endpoints:
      host:
        address: 127.0.0.1
        port: 5432
    readiness:
      from: host
      kind: tcp
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  redis:
    manager:
      kind: compose
      name: langfuse-dev
      file: docker-compose.dev.yml
      service: redis
    endpoints:
      host:
        address: 127.0.0.1
        port: 6379
    readiness:
      from: host
      kind: tcp
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  clickhouse:
    manager:
      kind: compose
      name: langfuse-dev
      file: docker-compose.dev.yml
      service: clickhouse
    endpoints:
      host:
        address: 127.0.0.1
        port: 8123
    readiness:
      from: host
      kind: http
      method: GET
      path: /ping
      success:
        status:
          - 200
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  minio:
    manager:
      kind: compose
      name: langfuse-dev
      file: docker-compose.dev.yml
      service: minio
    endpoints:
      host:
        address: 127.0.0.1
        port: 9090
    readiness:
      from: host
      kind: tcp
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
tasks:
  setup:env:dev:
    context: host
    description: Create `.env` from the documented development template when missing
    notes: |
      This follows the contributor setup path in `CONTRIBUTING.md`.
      It copies `.env.dev.example` to `.env` only when `.env` is absent.
    category: setup
    action:
      kind: copy_if_missing
      from: .env.dev.example
      to: .env
    effects:
      writes:
        - .env
  setup:env:test:
    context: host
    description: Create `.env.test` from the test template when missing
    notes: |
      The test template isolates PostgreSQL and Redis for repository tests.
      It is optional for pure lint/build loops but required for isolated test execution.
    category: setup
    action:
      kind: copy_if_missing
      from: .env.test.example
      to: .env.test
    effects:
      writes:
        - .env.test
  setup:env:selfhost:
    context: host
    description: Create `.env.selfhost` from the local self-host compose template when missing
    notes: |
      Use this for the published self-host compose path.
      It keeps self-host env truth separate from source-dev `.env` state without mutating copied files.
    category: setup
    action:
      kind: copy_if_missing
      from: .env.selfhost.example
      to: .env.selfhost
    effects:
      writes:
        - .env.selfhost
  setup:env:docker-build:
    context: host
    description: Create `.env.docker-build` from the source docker-build compose template when missing
    notes: |
      The source docker-build compose path needs its own env overlay.
      Keep container-internal service discovery separate from source-dev `.env` without mutating copied files.
    category: setup
    action:
      kind: copy_if_missing
      from: .env.docker-build.example
      to: .env.docker-build
    effects:
      writes:
        - .env.docker-build
  install:
    context: host
    description: Install monorepo dependencies with pnpm
    notes: |
      This maps directly to repository root install commands used in contributor docs and CI.
    category: setup
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: .
        manager: pnpm
        mode: install
    effects:
      writes:
        - node_modules
      network: true
      network_kind: dependency_hydration
    depends_on:
      - setup:env:dev
    requirements:
      toolchains:
        - node
  lint:
    context: host
    description: Run repository lint checks
    notes: |
      This maps directly to the CI lint phase (`pnpm run lint`).
    category: test
    run: pnpm run lint
    requirements:
      toolchains:
        - node
      checks:
        - workspace-dependencies-installed
    safe_for_agent: true
  typecheck:
    context: host
    description: Run repository type checks
    notes: |
      This maps directly to the CI typecheck phase (`pnpm run typecheck`).
    category: test
    run: pnpm run typecheck
    requirements:
      toolchains:
        - node
      checks:
        - workspace-dependencies-installed
    safe_for_agent: true
  build:
    context: host
    description: Build all workspace packages through Turbo
    notes: |
      This maps directly to CI build phases for web/worker validation.
    category: build
    run: pnpm run build
    effects:
      writes:
        - .turbo
        - web/.next
        - worker/dist
    requirements:
      toolchains:
        - node
      checks:
        - workspace-dependencies-installed
        - source-env-present
    safe_for_agent: true
  build:ci:
    context: host
    description: Install dependencies, then build all workspace packages through Turbo
    notes: |
      This is the from-scratch build path used by runtime workflows.
      Keep `build` itself dependency-free so agent-safe verification does not imply networked install.
    category: build
    run: pnpm run build
    effects:
      writes:
        - .turbo
        - web/.next
        - worker/dist
    depends_on:
      - install
    requirements:
      toolchains:
        - node
      checks:
        - workspace-dependencies-installed
        - source-env-present
  infra:dev:down:
    context: host
    description: Stop local development infrastructure containers
    category: setup
    adapter_inputs:
      compose:
        files:
          - docker-compose.dev.yml
    command:
      exe: docker
      args:
        - compose
        - down
    effects:
      external_state:
        - docker
    requirements:
      tools:
        docker: "*"
  db:migrate:
    context: host
    description: Apply Prisma migrations for local development
    notes: |
      This follows CI and contributor paths after infrastructure startup.
    category: setup
    run: pnpm run db:migrate
    effects:
      external_state:
        - postgres
    depends_on:
      - install
    requires_services:
      - postgres
    requirements:
      toolchains:
        - node
      checks:
        - workspace-dependencies-installed
  ch:up:
    context: host
    description: Apply ClickHouse migrations for local development
    notes: |
      This runs `packages/shared/clickhouse/scripts/up.sh` through the shared package script.
      It requires `golang-migrate` on the host.
    category: setup
    run: pnpm --filter=shared run ch:up
    effects:
      external_state:
        - clickhouse
    depends_on:
      - install
    requires_services:
      - clickhouse
    requirements:
      toolchains:
        - node
      tools:
        migrate: "*"
      checks:
        - workspace-dependencies-installed
        - golang-migrate-installed
  ch:dev-tables:
    context: host
    description: Create development-only ClickHouse tables used by dev and CI flows
    notes: |
      This runs `packages/shared/clickhouse/scripts/dev-tables.sh`.
      It requires the host `clickhouse` CLI binary.
    category: setup
    run: pnpm --filter=shared run ch:dev-tables
    effects:
      external_state:
        - clickhouse
    depends_on:
      - ch:up
    requires_services:
      - clickhouse
    requirements:
      toolchains:
        - node
      tools:
        clickhouse: "*"
      checks:
        - clickhouse-cli-installed
  db:seed:
    context: host
    description: Seed local database with standard repository seed data
    category: setup
    run: pnpm --filter=shared run db:seed
    effects:
      external_state:
        - postgres
    depends_on:
      - db:migrate
      - ch:up
    requires_services:
      - postgres
      - clickhouse
    requirements:
      toolchains:
        - node
    internal: true
  db:seed:examples:
    context: host
    description: Seed local database with example project data
    category: setup
    run: pnpm run db:seed:examples
    effects:
      external_state:
        - postgres
    depends_on:
      - db:migrate
      - ch:up
    requires_services:
      - postgres
      - clickhouse
    requirements:
      toolchains:
        - node
    internal: true
  verify:ci:
    context: host
    description: Run the main CI-style verify sequence for source changes
    notes: |
      This maps to the highest-signal root checks from `pipeline.yml`: lint, typecheck, build, and turbo tests.
      Tests run against local infra and isolated test env overlays.
    category: test
    run: pnpm run lint && pnpm run typecheck && pnpm run build && pnpm run test
    effects:
      writes:
        - .turbo
        - web/.next
        - worker/dist
      external_state:
        - postgres
        - redis
        - clickhouse
        - minio
    depends_on:
      - setup:env:test
      - install
      - db:migrate
      - ch:up
    requires_services:
      - postgres
      - redis
      - clickhouse
      - minio
    requirements:
      toolchains:
        - node
      checks:
        - workspace-dependencies-installed
  dev:
    context: host
    description: Start the documented source development workflow
    notes: |
      This follows contributor docs (`pnpm run dev`) after local infra and schema setup.
      It starts the web and worker development services from source.
    category: dev
    launch:
      kind: command
      exe: pnpm
      args: [run, dev]
    depends_on:
      - install
      - db:migrate
      - ch:up
      - ch:dev-tables
      - db:seed:examples
    requires_services:
      - postgres
      - redis
      - clickhouse
      - minio
    requirements:
      toolchains:
        - node
      checks:
        - workspace-dependencies-installed
    runtime:
      kind: service
      surfaces:
        web:
          project:
            host:
              primary: true
        worker: {}
  start:
    context: host
    description: Start the built production-mode source services
    notes: |
      This maps to the repo `start` script used by CI server-e2e paths after `pnpm run build`.
    category: dev
    launch:
      kind: command
      exe: pnpm
      args: [run, start]
    depends_on:
      - build:ci
      - db:migrate
      - ch:up
    requires_services:
      - postgres
      - redis
      - clickhouse
      - minio
    requirements:
      toolchains:
        - node
      checks:
        - workspace-dependencies-installed
    runtime:
      kind: service
      surfaces:
        web:
          project:
            host:
              primary: true
        worker: {}
  selfhost:compose:
    context: host
    description: Start the published self-host Docker Compose stack
    notes: |
      This follows the main README local self-host path (`docker compose up`).
      It runs packaged `langfuse` and `langfuse-worker` images with a dedicated self-host env overlay
      so source-dev `.env` state does not leak into the packaged runtime path.
    category: dev
    adapter_inputs:
      compose:
        env_files:
          - .env.selfhost
    launch:
      kind: command
      exe: docker
      args:
        - compose
        - up
    effects:
      network: true
      external_state:
        - docker
    depends_on:
      - setup:env:selfhost
    requirements:
      tools:
        docker: "*"
      checks:
        - selfhost-env-compose-compatible
    runtime:
      kind: service
      surfaces:
        web:
          project:
            host:
              primary: true
        worker: {}
  selfhost:compose:down:
    context: host
    description: Stop the published self-host Docker Compose stack
    category: setup
    adapter_inputs:
      compose:
        env_files:
          - .env.selfhost
    command:
      exe: docker
      args:
        - compose
        - down
    effects:
      external_state:
        - docker
    requirements:
      tools:
        docker: "*"
  build:docker:
    context: host
    description: Build source Docker images with the repository docker-build compose file
    notes: |
      This maps to `test-docker-build` CI behavior before runtime checks.
    category: build
    adapter_inputs:
      compose:
        env_files:
          - .env.docker-build
        files:
          - docker-compose.build.yml
    command:
      exe: docker
      args:
        - compose
        - build
    effects:
      network: true
      external_state:
        - docker
    depends_on:
      - setup:env:docker-build
    requirements:
      tools:
        docker: "*"
      checks:
        - docker-build-env-compose-compatible
  run:docker:
    context: host
    description: Start source-built Docker stack and wait for health checks
    notes: |
      This maps to CI docker-build readiness checks against web (`3000`) and worker (`3030`) APIs.
    category: dev
    adapter_inputs:
      compose:
        env_files:
          - .env.docker-build
        files:
          - docker-compose.build.yml
    launch:
      kind: command
      exe: docker
      args:
        - compose
        - up
    effects:
      external_state:
        - docker
    depends_on:
      - build:docker
    requirements:
      tools:
        docker: "*"
      checks:
        - docker-build-env-compose-compatible
    runtime:
      kind: service
      surfaces:
        web:
          project:
            host:
              primary: true
        worker: {}
  stop:docker:
    context: host
    description: Stop source-built Docker stack
    category: setup
    adapter_inputs:
      compose:
        env_files:
          - .env.docker-build
        files:
          - docker-compose.build.yml
    command:
      exe: docker
      args:
        - compose
        - down
    effects:
      external_state:
        - docker
    requirements:
      tools:
        docker: "*"
workflows:
  default: source-dev
  source-dev:
    intent: local_development
    description: Canonical contributor path from source with local infra dependencies
    notes: |
      This mirrors the contributor docs flow with explicit deterministic steps instead of `dx`.
      It is the strongest path for source development readiness pressure-testing.
    prepare:
      task: setup:env:dev
    setup:
      task: db:seed:examples
    run:
      task: dev
    readiness:
      surfaces:
        - web
        - worker
    exposes:
      - surface: web
      - surface: worker
  source-start:
    intent: ci_verification
    description: CI-style build then start path from source
    prepare:
      task: setup:env:dev
    setup:
      task: build:ci
    run:
      task: start
    readiness:
      surfaces:
        - web
        - worker
    exposes:
      - surface: web
      - surface: worker
  verify:
    intent: ci_verification
    description: CI-style root verification sequence over source
    prepare:
      task: setup:env:dev
    run:
      task: verify:ci
  selfhost:
    intent: packaged_runtime
    description: README self-host flow using published Docker images
    prepare:
      task: setup:env:selfhost
    run:
      task: selfhost:compose
    readiness:
      surfaces:
        - web
        - worker
    exposes:
      - surface: web
      - surface: worker
  docker-build:
    intent: packaged_runtime
    description: Source docker-build compose path used in CI docker image verification
    prepare:
      task: setup:env:docker-build
    run:
      task: run:docker
    readiness:
      surfaces:
        - web
        - worker
    exposes:
      - surface: web
      - surface: worker
checks:
  - name: workspace-dependencies-installed
    kind: file
    severity: error
    path: node_modules/.modules.yaml
    expect: file
    timeout: 10000
  - name: source-env-present
    kind: file
    severity: error
    path: .env
    expect: file
    timeout: 10000
  - name: selfhost-env-compose-compatible
    kind: precondition
    severity: error
    run: >-
      sh -c '[ ! -f .env.selfhost ] || ! grep -Eq
      "^(DATABASE_URL|DIRECT_URL)=\"postgresql://[^\"]+@(localhost|127\\.0\\.0\\.1):|^CLICKHOUSE_URL=\"http://(localhost|127\\.0\\.0\\.1):|^REDIS_HOST=\"?(localhost|127\\.0\\.0\\.1)\"?$"
      .env.selfhost'
    timeout: 10000
  - name: docker-build-env-compose-compatible
    kind: precondition
    severity: error
    run: >-
      sh -c '[ ! -f .env.docker-build ] || ! grep -Eq
      "^(DATABASE_URL|DIRECT_URL)=\"postgresql://[^\"]+@(localhost|127\\.0\\.0\\.1):|^CLICKHOUSE_(MIGRATION_URL|URL)=\"?(clickhouse://|http://)(localhost|127\\.0\\.0\\.1):|^LANGFUSE_S3_(BATCH_EXPORT|MEDIA_UPLOAD|EVENT_UPLOAD)_ENDPOINT=\"?http://(localhost|127\\.0\\.0\\.1):|^REDIS_HOST=\"?(localhost|127\\.0\\.0\\.1)\"?$"
      .env.docker-build'
    timeout: 10000
  - name: golang-migrate-installed
    kind: precondition
    severity: error
    run: sh -c "migrate -version"
    timeout: 10000
  - name: clickhouse-cli-installed
    kind: precondition
    severity: error
    run: sh -c "clickhouse client --version"
    timeout: 10000
agent:
  posture: readiness_strict
  entrypoint: install
  default_task: verify:ci
  safe_tasks:
    - lint
    - typecheck
    - build
  verify_after_changes:
    - lint
    - typecheck
    - build
  writable_paths:
    - web
    - worker
    - packages
    - ee
    - scripts
    - CONTRIBUTING.md
    - .turbo
  protected_paths:
    - ota.yaml
    - .env
    - .env.docker-build
    - .env.selfhost
    - .env.test
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - turbo.json
    - docker-compose.yml
    - docker-compose.dev.yml
    - docker-compose.dev-azure.yml
    - docker-compose.dev-redis-cluster.yml
    - docker-compose.build.yml
    - .env.dev.example
    - .env.dev-azure.example
    - .env.dev-redis-cluster.example
    - .env.docker-build.example
    - .env.prod.example
    - .env.selfhost.example
    - .env.test.example
    - .github/ISSUE_TEMPLATE
    - .github/workflows
    - .github/workflows/release.yml
  bootstrap:
    ota:
      note: Install ota when missing so contributors and agents can run the readiness workflows declared in this contract.
      sh: curl -fsSL https://dist.ota.run/install.sh | OTA_GIT_REV=04bd078fd58e2686b2855eb8a57e6fdd746810a2 sh -s -- --from-git
      powershell: $env:OTA_GIT_REV='04bd078fd58e2686b2855eb8a57e6fdd746810a2'; & ([scriptblock]::Create((irm https://dist.ota.run/install.ps1))) -FromGit
  notes: |
    Use `ota tasks --use .` to list runnable tasks and review the agent-safe surface before execution.
    Use `ota run setup:env:dev .` to create source-dev `.env` only when missing.
    Use `ota run setup:env:docker-build .` to create the dedicated docker-build env overlay only when missing.
    Use `ota run setup:env:selfhost .` to create the dedicated self-host env overlay only when missing.
    Use `ota up --workflow source-dev --native .` for the canonical source contributor loop.
    Use `ota up --workflow source-start --native .` for CI-style build then startup from source.
    Use `ota up --workflow verify --native .` before PRs.
    Container mode is intentionally not modeled for source workflows in this slice because
    verify/source paths depend on host-bound local service orchestration.
    Use `ota up --workflow selfhost --native .` for README self-host runtime from published images.
    Use `ota up --workflow docker-build --native .` for source-built docker compose runtime proof.
    Protected paths include compose/env/workflow and release surfaces; keep runtime setup through
    setup tasks and workflow runs instead of direct file mutation.
